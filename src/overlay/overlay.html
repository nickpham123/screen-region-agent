<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: crosshair;
      }

      #badge {
        position: fixed;
        transform: translate(-50%, -150%);
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font: 13px -apple-system, sans-serif;
        pointer-events: none;
        transition: opacity 0.15s ease;
      }

      #trail {
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
      }

      #resetFlash {
        position: fixed;
        width: 12px;
        height: 12px;
        margin-left: -6px;
        margin-top: -6px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.9);
        pointer-events: none;
        opacity: 0;
      }

      #resetFlash.flash {
        animation: reset-flash 0.35s ease-out;
      }

      @keyframes reset-flash {
        0% { opacity: 0.9; transform: scale(0.5); }
        100% { opacity: 0; transform: scale(2.5); }
      }
    </style>
  </head>
  <body>
    <div id="badge">Release to select</div>
    <canvas id="trail"></canvas>
    <div id="resetFlash"></div>
    <script src="overlay.js"></script>
  </body>
</html>
